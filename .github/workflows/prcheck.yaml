name: Build Electron App

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20 # Match the Node version you use locally

    - name: Install dependencies
      run: npm ci # Use npm ci for clean, reliable installs based on package-lock.json

    - name: Build app
      run: npm run build # Adjust this if your build script in package.json is named differently (e.g., npm run dist)